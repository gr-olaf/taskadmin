<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAdmin — Управление задачами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <h1 class="h3 mb-0">Управление задачами</h1>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted" id="taskCount"></span>
        <button class="btn btn-primary" id="btnCreate">Создать задачу</button>
      </div>
    </header>

    <div class="d-none mb-4" id="formWrapper">
      <form id="taskForm" class="card shadow-sm">
        <div class="card-body">
          <div class="mb-3">
            <label for="taskTitle" class="form-label">Заголовок задачи *</label>
            <input type="text" id="taskTitle" class="form-control" maxlength="255" required>
            <div class="invalid-feedback" id="errorTitle"></div>
          </div>
          <div class="mb-3">
            <label for="taskDesc" class="form-label">Описание задачи</label>
            <textarea id="taskDesc" class="form-control" maxlength="2000" rows="4"></textarea>
            <div class="invalid-feedback" id="errorDesc"></div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-secondary" id="btnCancel">Отмена</button>
          </div>
          <input type="hidden" id="editTaskId">
        </div>
      </form>
    </div>

    <div id="taskList" class="row g-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
